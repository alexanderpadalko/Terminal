name: Build Windows FlowDesk exe
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  archive-check:
    # Service availability is recorded independently of tests and packaging.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - run: python -m pip install tzdata==2026.4
      - name: Replay available AFKS exchange archive
        run: python -u tools/check_afks_archive.py
      - name: Save market inputs and replay result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AFKS-archive-replay
          path: archive-check/
          retention-days: 7
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use stable Python 3.15.2 (x64)
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
          architecture: x64
          check-latest: false
      - name: Install stable pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Run calculation tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test Qt (headless)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from flowdesk.gui import MainWindow; app = QApplication([]); w=MainWindow(); print('GUI constructed:', w.windowTitle()); w.close()"
      - name: Build portable Windows executable
        run: python -m PyInstaller --clean --noconfirm --windowed --onedir --name FlowDesk --collect-all tzdata main.py
      - name: Publish entire standalone directory
        uses: actions/upload-artifact@v4
        with:
          name: FlowDesk-Windows-x64-Python-3.15.2
          path: dist/FlowDesk/
          if-no-files-found: error
          retention-days: 30
