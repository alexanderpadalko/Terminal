name: FlowDesk 0.2.26 — Finam Windows CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flowdesk-finam-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Use stable Python 3.15.2 x64
        uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
          architecture: x64
          check-latest: false
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Validate v2.11 calculations and Finam adapters (offline)
        run: |
          python tools/build_v211_reference.py
          python tools/build_v211_settings.py
          python -m unittest discover -s tests -v
      - name: Smoke test Finam-only Qt window with no token
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM='offscreen'
          python -c "from PySide6.QtWidgets import QApplication; from flowdesk.finam_gui import FinamWindow; app=QApplication([]); w=FinamWindow(); assert 'Finam Trade API' in w.windowTitle(); assert w.http.text()=='HTTP'; w.close(); print('FINAM_ONLY_WINDOW_OK')"
      - name: Prepare FlowDesk taskbar and EXE icon
        run: python tools/build_app_icon.py
      - name: Build portable Windows EXE (Finam only)
        run: python -m PyInstaller --clean --noconfirm --windowed --onedir --name FlowDesk --icon flowdesk/assets/flowdesk.ico --add-data "flowdesk/assets;flowdesk/assets" --collect-all tzdata --collect-all websockets --collect-all keyring --add-data "flowdesk/data;flowdesk/data" main.py
      - name: Verify packaged EXE cleanly closes without a token
        run: python -u tools/check_exe_shutdown.py dist/FlowDesk/FlowDesk.exe
      - name: Publish standalone EXE folder
        uses: actions/upload-artifact@v4
        with:
          name: FlowDesk-0.2.26-Finam-Windows-x64
          path: dist/FlowDesk/
          if-no-files-found: error
          retention-days: 30
      - name: Save smoke-test evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FlowDesk-0.2.26-Finam-Test-Evidence
          path: shutdown-exe-result.json
          retention-days: 30
