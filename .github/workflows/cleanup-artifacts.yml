name: Keep only the latest successful FlowDesk Actions artifacts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-artifacts.yml'
  workflow_run:
    workflows:
      - 'FlowDesk 0.2.26 — Finam Windows CI'
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: flowdesk-artifact-cleanup
  cancel-in-progress: false

jobs:
  remove-old-builds:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Keep latest verified ZIP and its evidence, delete older Actions artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          api = "https://api.github.com/repos/" + repository
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": "Bearer " + token,
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "FlowDesk-artifact-retention",
          }

          def request(path, method="GET"):
              req = Request(api + path, headers=headers, method=method)
              for attempt in range(5):
                  try:
                      with urlopen(req, timeout=60) as response:
                          body = response.read()
                          return json.loads(body) if body else None
                  except HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) and not (
                          exc.code == 403 and exc.headers.get("Retry-After")
                      ):
                          raise
                      if attempt == 4:
                          raise
                      time.sleep(min(30, 2 ** attempt + 2))
              raise RuntimeError("GitHub API retries exhausted")

          # Never purge a release until a successful main-branch Windows build
          # with an actual Windows ZIP has been located and protected.
          runs = request("/actions/workflows/build-windows.yml/runs?branch=main&status=success&per_page=50")["workflow_runs"]
          keep_run = None
          keep_ids = set()
          for run in runs:
              if run.get("conclusion") != "success" or run.get("head_branch") != "main":
                  continue
              items = request("/actions/runs/" + str(run["id"]) + "/artifacts?per_page=100")["artifacts"]
              valid = [a for a in items if not a.get("expired") and
                       a["name"].startswith("FlowDesk-") and "-Windows-x64-" in a["name"]]
              if valid:
                  keep_run = run["id"]
                  keep_ids = {a["id"] for a in items if not a.get("expired")}
                  break
          if keep_run is None or not keep_ids:
              raise RuntimeError("Refusing cleanup: no verified Windows ZIP to preserve")

          # Protect in-progress runs from deletion; their artifacts will be
          # checked after the next workflow completion.
          recent = request("/actions/runs?per_page=100")["workflow_runs"]
          active_runs = {run["id"] for run in recent if run["status"] != "completed"}

          all_artifacts = []
          for page in range(1, 101):
              batch = request("/actions/artifacts?per_page=100&page=" + str(page))["artifacts"]
              all_artifacts.extend(batch)
              if len(batch) < 100:
                  break
          else:
              raise RuntimeError("Artifact inventory exceeded 10,000; refusing incomplete cleanup")

          old = [a for a in all_artifacts
                 if a["id"] not in keep_ids and
                 (a.get("workflow_run") or {}).get("id") not in active_runs]
          print("Protected successful run:", keep_run,
                "; artifact IDs:", sorted(keep_ids))
          print("Existing artifacts:", len(all_artifacts),
                "; eligible for deletion:", len(old))
          deleted_bytes = 0
          for item in old:
              request("/actions/artifacts/" + str(item["id"]), "DELETE")
              deleted_bytes += item.get("size_in_bytes", 0)
              print("Deleted artifact", item["id"], item["name"])
              # Stay well below secondary GitHub write API throttling.
              time.sleep(0.5)
          print("Deleted:", len(old), "artifacts;",
                round(deleted_bytes / (1024 * 1024), 2), "MiB")
          remaining = request("/actions/runs/" + str(keep_run) + "/artifacts?per_page=100")["artifacts"]
          remaining_ids = {a["id"] for a in remaining}
          if not keep_ids.issubset(remaining_ids):
              raise RuntimeError("Protected build artifacts missing after cleanup")
          print("Verified preservation of latest Windows ZIP and evidence.")
          PY
