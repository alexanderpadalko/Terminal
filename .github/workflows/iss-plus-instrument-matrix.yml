name: ISS Plus DEMO instrument availability matrix
on:
  pull_request:
    paths:
      - diagnostics/iss_plus_instrument_matrix.py
      - .github/workflows/iss-plus-instrument-matrix.yml
permissions:
  contents: read
jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - run: python -m pip install websockets==15.0.1 tzdata==2026.4
      - name: Probe ISS+ DEMO instruments without changing FlowDesk
        run: python -u diagnostics/iss_plus_instrument_matrix.py
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ISSPlus-DEMO-instrument-matrix
          path: iss-plus-instruments/
          retention-days: 30
