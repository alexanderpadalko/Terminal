name: Read-only ISS Plus DEMO diagnostics
on:
  workflow_dispatch:
  pull_request:
    paths:
      - diagnostics/iss_plus_demo/**
      - .github/workflows/iss-plus-diagnostic.yml

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.action == 'opened' || github.event.action == 'reopened'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - run: python -m pip install websockets==15.0.1 tzdata==2026.4
      - run: python diagnostics/iss_plus_demo/probe.py --self-test
      - run: python -u diagnostics/iss_plus_demo/probe.py --mode smoke --out iss-plus-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ISSPlus-DEMO-smoke
          path: iss-plus-smoke/
          retention-days: 30
  full:
    needs: smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15.2'
      - run: python -m pip install websockets==15.0.1 tzdata==2026.4
      - run: python diagnostics/iss_plus_demo/probe.py --self-test
      - run: python -u diagnostics/iss_plus_demo/probe.py --mode full --out iss-plus-full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ISSPlus-DEMO-${{ matrix.os }}
          path: iss-plus-full/
          retention-days: 30
